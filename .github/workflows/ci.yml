name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: python manage.py setup
      - name: Tests and local launcher
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/python.exe -m pytest api/tests -q
          else
            .venv/bin/python -m pytest api/tests -q
          fi
      - name: Lint
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/python.exe -m ruff check api manage.py scripts
          else
            .venv/bin/python -m ruff check api manage.py scripts
          fi

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: leafa
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: leafa_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leafa -d leafa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r api/requirements-dev.txt
      - run: python -m pytest api/tests/test_postgresql.py -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://leafa:ci-only-password@localhost:5432/leafa_ci

  docker:
    name: Docker API and database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-only-disposable-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8000/health
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Cleanup disposable CI database
        if: always()
        run: docker compose down --volumes

  gate:
    name: CI required
    if: always()
    needs: [python, postgres, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PY

  deploy:
    name: Deploy Render
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/deploy_render.py
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
