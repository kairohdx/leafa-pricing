name: leafa-pricing
services:
  db:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_DB: leafa
      POSTGRES_USER: leafa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U leafa -d leafa"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://leafa:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@db:5432/leafa
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      SESSION_HOURS: ${SESSION_HOURS:-24}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
volumes:
  postgres_data:
# Frontend service will be added with its implementation; no placeholder image.
