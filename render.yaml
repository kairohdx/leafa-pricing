services:
  - type: web
    name: leafa-api
    runtime: python
    plan: starter
    autoDeployTrigger: "off"
    buildCommand: pip install -r api/requirements.txt
    preDeployCommand: python -m alembic -c api/alembic.ini upgrade head
    startCommand: python -m uvicorn app.main:app --app-dir api --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: leafa-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "[]"
databases:
  - name: leafa-db
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: leafa
    user: leafa
    ipAllowList: []
