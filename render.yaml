services:
  - type: web
    name: leafa-api
    runtime: python
    plan: starter
    autoDeployTrigger: "off"
    buildCommand: pip install -r api/requirements.txt
    preDeployCommand: python -m alembic -c api/alembic.ini upgrade head
    startCommand: python -m uvicorn app.main:app --app-dir api --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: leafa-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: leafa-front
    runtime: static
    rootDir: front
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm run build:hosted
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /health.json
        name: Cache-Control
        value: no-store
databases:
  - name: leafa-db
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: leafa
    user: leafa
    ipAllowList: []
